<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">MODUS</title>
  <desc id="desc">MODUS is a multiplayer FPS mechanics lab for Godot 4.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.55" stop-color="#0a1328"/>
      <stop offset="1" stop-color="#071a24"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35d9ff"/>
      <stop offset="0.55" stop-color="#168cff"/>
      <stop offset="1" stop-color="#3157d5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#19bfff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#19bfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#79b8ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="30" fill="url(#background)"/>
  <rect width="1280" height="420" rx="30" fill="url(#grid)"/>
  <ellipse cx="205" cy="205" rx="310" ry="285" fill="url(#glow)"/>
  <path d="M1010 0h270v138L1134 258 941 65z" fill="#10254a" fill-opacity="0.32"/>
  <path d="M1280 178v242H1038l-76-76z" fill="#062b35" fill-opacity="0.38"/>

  <g filter="url(#shadow)">
    <rect x="82" y="78" width="264" height="264" rx="54" fill="#0b101c" stroke="#263d5d" stroke-width="3"/>
    <path d="M126 134h176" stroke="#32d7e8" stroke-width="8" stroke-linecap="round"/>
    <path d="M126 287h176" stroke="#2469df" stroke-width="8" stroke-linecap="round"/>
    <path d="M151 261V164h43l20 53 20-53h43v97h-34v-54l-20 54h-18l-20-54v54z" fill="url(#mark)"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="410" y="154" fill="#f8fafc" font-size="76" font-weight="760" letter-spacing="12">MODUS</text>
    <text x="414" y="205" fill="#8edcff" font-size="23" font-weight="600" letter-spacing="2">BUILD. FIGHT. REWRITE THE RULES.</text>
    <text x="414" y="255" fill="#c8d5e8" font-size="23">A multiplayer FPS mechanics lab for Godot 4.</text>

    <g font-size="16" font-weight="650" letter-spacing="0.4">
      <rect x="414" y="290" width="128" height="43" rx="21.5" fill="#102744" stroke="#2d74b8"/>
      <text x="478" y="317" fill="#b9eaff" text-anchor="middle">MOVEMENT</text>
      <rect x="556" y="290" width="112" height="43" rx="21.5" fill="#102744" stroke="#2d74b8"/>
      <text x="612" y="317" fill="#b9eaff" text-anchor="middle">COMBAT</text>
      <rect x="682" y="290" width="176" height="43" rx="21.5" fill="#102744" stroke="#2d74b8"/>
      <text x="770" y="317" fill="#b9eaff" text-anchor="middle">PROCEDURAL</text>
      <rect x="872" y="290" width="156" height="43" rx="21.5" fill="#102744" stroke="#2d74b8"/>
      <text x="950" y="317" fill="#b9eaff" text-anchor="middle">NETWORKING</text>
      <rect x="1042" y="290" width="116" height="43" rx="21.5" fill="#33250f" stroke="#a16207"/>
      <text x="1100" y="317" fill="#ffe5a3" text-anchor="middle">MODDING</text>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="1277" height="417" rx="28.5" fill="none" stroke="#294363" stroke-width="3"/>
</svg>
