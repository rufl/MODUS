name: CI/CD Pipeline - MODUS Framework

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.7.2"
  GODOT_LINUX_ARCHIVE_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
  GODOT_EXPORT_TEMPLATES_SHA256: "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"

jobs:
  code-quality:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate release toolchain lock
        run: python3 tools/validate_toolchain_lock.py

      - name: Install GDScript Toolkit
        run: python -m pip install gdtoolkit==4.5.0
      - name: Install pinned GUT dependency for truth checks
        run: bash tools/scripts/install-gut.sh

      - name: Check GDScript Formatting
        run: gdformat --check --diff game/ shared/ standalone/ tests/

      - name: Run GDScript Linting
        run: gdlint game/ shared/ standalone/ tests/

      - name: Check Project Truth
        run: bash tools/check_project_truth.sh

      - name: Check Export Smoke Helper
        run: test -x tools/run_export_smoke.sh

      - name: Check release engineering contracts
        run: |
          bash tests/runners/test_release_artifact_validator.sh
          bash tests/runners/test_linux_portable_package.sh
          bash tests/runners/test_release_staging.sh
          bash tests/runners/test_overzeer_package.sh
          bash tests/runners/test_overzeer_release_inventory.sh
          bash tests/runners/test_cleanup_overzeer_archives.sh
          bash tests/runners/test_performance_evidence_validator.sh
          bash tests/runners/test_toolchain_lock.sh
          bash tests/runners/test_windows_acceptance_metadata.sh
          bash tests/runners/test_ci_artifact_manifest.sh
          bash tests/runners/test_retrourban_assets.sh
          bash tests/runners/test_fence_assets.sh
          bash tests/runners/test_office_assets.sh

  test:
    name: Run GUT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Keep the CI property suite bounded; local runs retain the full sampling budget.
    env:
      MODUS_PROPERTY_ITERATIONS: "5"
    needs: code-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install pinned GUT dependency
        run: bash tools/scripts/install-gut.sh

      - name: Install Godot
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/$archive"
          printf '%s  %s\n' "$GODOT_LINUX_ARCHIVE_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          mkdir -p test-results

      - name: Cache import assets
        uses: actions/cache@v6
        with:
          path: .godot/imported/
          key: import-assets-v2-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', '**/*.glb', '**/*.obj', '**/*.png', '**/*.svg', '**/*.ttf', '**/*.wav', '**/*.ogg', '**/*.mp3', '**/*.tscn', '**/*.tres', '**/*.res', 'project.godot') }}
          # Do not restore a cache for a different source tree: generated imports can be stale
          # even when tracked .import metadata is unchanged.

      - name: Import project assets
        run: |
          set -o pipefail
          import_log="$RUNNER_TEMP/godot-import.log"
          godot --version
          if ! godot --headless --verbose --path . --import 2>&1 | tee "$import_log"; then
            printf 'Godot asset import failed. Import log: %s\n' "$import_log" >&2
            exit 1
          fi
          if grep -Fq 'Failed loading resource' "$import_log"; then
            printf 'Godot reported missing resources during import:\n' >&2
            grep -Fn 'Failed loading resource' "$import_log" >&2
            printf 'Godot import diagnostics reported above.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Run packaged startup smoke
        run: bash tests/runners/test_package_smoke.sh

      - name: Run qualification network regression
        run: bash tests/runners/test_windows_network_qualification.sh

      - name: Run Unit and Integration Tests
        id: unit-tests
        run: |
          source tests/runners/headless_common.sh
          modus_collect_gut_tests tests/unit tests/integration
          modus_print_headless_selection
          set -o pipefail
          modus_run_godot godot --headless -s addons/gut/gut_cmdln.gd \
            "${MODUS_GUT_TEST_ARGS[@]}" -gdisable_colors 2>&1 | tee test-results/unit-tests.log
          # GUT's bootstrap can exit zero before running tests if imports fail.
          grep -Eq '^[[:space:]]*Tests[[:space:]]+[1-9][0-9]*[[:space:]]*$' test-results/unit-tests.log

      - name: Run Property-Based Tests
        id: property-tests
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        run: |
          source tests/runners/headless_common.sh
          modus_collect_gut_tests tests/property
          modus_print_headless_selection
          set -o pipefail
          modus_run_godot godot --headless -s addons/gut/gut_cmdln.gd \
            "${MODUS_GUT_TEST_ARGS[@]}" -gdisable_colors 2>&1 | tee test-results/property-tests.log
          grep -Eq '^[[:space:]]*Tests[[:space:]]+[1-9][0-9]*[[:space:]]*$' test-results/property-tests.log

      - name: Run Benchmark Tests
        id: benchmark-tests
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          source tests/runners/headless_common.sh
          modus_collect_gut_tests tests/benchmarks
          modus_print_headless_selection
          set -o pipefail
          modus_run_godot godot --headless -s addons/gut/gut_cmdln.gd \
            "${MODUS_GUT_TEST_ARGS[@]}" -gdisable_colors 2>&1 | tee test-results/benchmark-tests.log
          grep -Eq '^[[:space:]]*Tests[[:space:]]+[1-9][0-9]*[[:space:]]*$' test-results/benchmark-tests.log

      - name: Publish Test Summary
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit-tests.outcome }}
          PROPERTY_OUTCOME: ${{ steps.property-tests.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.benchmark-tests.outcome }}
        run: |
          mkdir -p test-results
          {
            printf '# MODUS Test Results\n\n'
            printf '| Suite | Status |\n| --- | --- |\n'
            printf '| Unit and integration | %s |\n' "$UNIT_OUTCOME"
            printf '| Property-based | %s |\n' "$PROPERTY_OUTCOME"
            printf '| Benchmarks (informational) | %s |\n' "$BENCHMARK_OUTCOME"
            printf '\nDetailed GUT results are in the test-results artifact.\n'
            printf 'GUI-required tests remain outside the maintained headless suite.\n'
          } | tee test-results/test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results/
            logs/
            *.log
          retention-days: 30

  build:
    name: Build Project (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux
            preset: Dedicated Server (Linux)
            executable: MODUS.x86_64
            smoke_platform: linux
          - platform: linux-client
            preset: Linux Desktop
            executable: modus.x86_64
            smoke_platform: linux
          - platform: linux-editor
            preset: Standalone Editor Linux
            executable: modus-editor.x86_64
            smoke_platform: linux
          - platform: windows
            preset: Windows Desktop
            executable: MODUS.exe
            smoke_platform: windows
          - platform: editor
            preset: Standalone Editor
            executable: MODUS-editor.exe
            smoke_platform: editor
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install pinned GUT dependency
        run: bash tools/scripts/install-gut.sh

      - name: Install Godot and export templates
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --output "$RUNNER_TEMP/$archive" "$release_url/$archive"
          printf '%s  %s\n' "$GODOT_LINUX_ARCHIVE_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl --fail --location --output "$RUNNER_TEMP/export_templates.tpz" \
            "$release_url/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          printf '%s  %s\n' "$GODOT_EXPORT_TEMPLATES_SHA256" "$RUNNER_TEMP/export_templates.tpz" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/export_templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Cache import assets
        uses: actions/cache@v6
        with:
          path: .godot/imported/
          key: import-assets-v2-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', '**/*.glb', '**/*.obj', '**/*.png', '**/*.svg', '**/*.ttf', '**/*.wav', '**/*.ogg', '**/*.mp3', '**/*.tscn', '**/*.tres', '**/*.res', 'project.godot') }}
          # Do not restore a cache for a different source tree: generated imports can be stale
          # even when tracked .import metadata is unchanged.

      - name: Import project assets
        run: |
          set -o pipefail
          import_log="$RUNNER_TEMP/godot-import.log"
          godot --version
          if ! godot --headless --verbose --path . --import 2>&1 | tee "$import_log"; then
            printf 'Godot asset import failed. Import log: %s\n' "$import_log" >&2
            exit 1
          fi
          if grep -Fq 'Failed loading resource' "$import_log"; then
            printf 'Godot reported missing resources during import:\n' >&2
            grep -Fn 'Failed loading resource' "$import_log" >&2
            printf 'Godot import diagnostics reported above.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Build for ${{ matrix.platform }}
        env:
          EXPORT_PLATFORM: ${{ matrix.platform }}
          EXPORT_PRESET: ${{ matrix.preset }}
          EXPORT_EXECUTABLE: ${{ matrix.executable }}
          SMOKE_PLATFORM: ${{ matrix.smoke_platform }}
        run: |
          mkdir -p "build/$EXPORT_PLATFORM"
          godot --headless --verbose --path . --export-release "$EXPORT_PRESET" \
            "build/$EXPORT_PLATFORM/$EXPORT_EXECUTABLE"
          test -s "build/$EXPORT_PLATFORM/$EXPORT_EXECUTABLE"
          test -s "build/$EXPORT_PLATFORM/${EXPORT_EXECUTABLE%.*}.pck"
          bash tools/run_export_smoke.sh \
            --platform "$SMOKE_PLATFORM" \
            --executable "build/$EXPORT_PLATFORM/$EXPORT_EXECUTABLE" \
            --log "build/$EXPORT_PLATFORM/export-launch.log"

      - name: Generate artifact manifest
        env:
          EXPORT_PLATFORM: ${{ matrix.platform }}
          EXPORT_PRESET: ${{ matrix.preset }}
          EXPORT_EXECUTABLE: ${{ matrix.executable }}
        run: |
          artifact_dir="build/$EXPORT_PLATFORM"
          manifest="$artifact_dir/manifest.json"
          (
            cd "$artifact_dir"
            sha256sum "$EXPORT_EXECUTABLE" "${EXPORT_EXECUTABLE%.*}.pck"
          ) > "$artifact_dir/SHA256SUMS"
          python3 tools/generate_ci_artifact_manifest.py \
            --root "$artifact_dir" \
            --output "$manifest" \
            --platform "$EXPORT_PLATFORM" \
            --preset "$EXPORT_PRESET" \
            --executable "$EXPORT_EXECUTABLE" \
            --commit "$GITHUB_SHA" \
            --godot-version "$GODOT_VERSION" \
            --toolchain-lock tools/toolchain.lock.json

      - name: Verify artifact manifest
        run: |
          artifact_dir="build/${{ matrix.platform }}"
          (cd "$artifact_dir" && sha256sum --check SHA256SUMS)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-build-${{ github.run_number }}
          path: build/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14

  windows-native-qualification:
    name: Native Windows Client Qualification
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [build]
    if: ${{ success() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows client artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-${{ github.run_number }}
          path: artifacts/windows/

      - name: Run native acceptance evidence bundle
        id: acceptance
        continue-on-error: true
        shell: pwsh
        run: |
          & .\tools\qualify_windows_acceptance.ps1 `
            -Executable "${{ github.workspace }}\artifacts\windows\MODUS.exe" `
            -EvidenceDirectory "${{ github.workspace }}\windows-acceptance-evidence" `
            -NetworkMode Pair

      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-acceptance-evidence-${{ github.run_number }}
          path: |
            windows-acceptance-evidence/
            artifacts/windows/manifest.json
            artifacts/windows/SHA256SUMS
          if-no-files-found: warn
          retention-days: 30

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    name: Verify Staging Artifacts
    runs-on: ubuntu-latest
    needs: [test, build, security-scan]
    if: github.ref == 'refs/heads/develop' && success()
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build-${{ github.run_number }}'
          path: artifacts/

      - name: Verify Build Artifacts
        run: |
          test -s "artifacts/linux-build-${{ github.run_number }}/MODUS.x86_64"
          test -s "artifacts/linux-build-${{ github.run_number }}/MODUS.pck"
          test -s "artifacts/windows-build-${{ github.run_number }}/MODUS.exe"
          test -s "artifacts/windows-build-${{ github.run_number }}/MODUS.pck"
          test -s "artifacts/editor-build-${{ github.run_number }}/MODUS-editor.exe"
          test -s "artifacts/editor-build-${{ github.run_number }}/MODUS-editor.pck"
          for platform in linux-client linux-editor; do
            artifact_dir="artifacts/$platform-build-${{ github.run_number }}"
            (cd "$artifact_dir" && sha256sum --check SHA256SUMS)
          done
          for platform in linux windows editor; do
            artifact_dir="artifacts/$platform-build-${{ github.run_number }}"
            (cd "$artifact_dir" && sha256sum --check SHA256SUMS)
          done
          printf 'Downloaded artifact checksums verified; no public deployment is configured.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Install Zig for Windows package launcher
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build Windows package smoke launcher
        run: |
          mkdir -p build/ztash
          zig cc -target x86_64-windows-gnu -O2 -s -municode \
            tools/ztash_windows_launcher.c -o build/ztash/modus.exe

      - name: Assemble versioned Linux release candidate
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          version="$(python3 -c 'import re; from pathlib import Path; print(re.search(r"GAME_VERSION := \"([^\"]+)\"", Path("game/core/constants.gd").read_text())[1])')"
          # Artifact upload/download does not preserve Linux executable permissions.
          chmod +x "artifacts/linux-build-$BUILD_NUMBER/MODUS.x86_64" \
            "artifacts/linux-client-build-$BUILD_NUMBER/modus.x86_64" \
            "artifacts/linux-editor-build-$BUILD_NUMBER/modus-editor.x86_64"
          python3 tools/validate_release_artifacts.py \
            --version "$version" --commit "$BUILD_COMMIT" --godot-version "$GODOT_VERSION" \
            --root artifacts --output artifacts/release-manifest.json \
            --client "artifacts/linux-client-build-$BUILD_NUMBER/modus.x86_64" \
            --server "artifacts/linux-build-$BUILD_NUMBER/MODUS.x86_64" \
            --editor "artifacts/linux-editor-build-$BUILD_NUMBER/modus-editor.x86_64"
          python3 tools/stage_release_artifacts.py --manifest artifacts/release-manifest.json \
            --output "build/release/MODUS-$version-linux-x86_64"
          bash tools/package_linux_portable.sh package \
            --artifact-dir "artifacts/linux-client-build-$BUILD_NUMBER" --version "$version" \
            --output "build/release/MODUS-$version-linux-portable.tar.zst"
          python3 tools/package_overzeer.py package \
            --version "$version" --target linux-x86_64 \
            --executable "artifacts/linux-client-build-$BUILD_NUMBER/modus.x86_64" \
            --content "artifacts/linux-client-build-$BUILD_NUMBER/modus.pck" \
            --readme README.md --license LICENSE \
            --extra "server=artifacts/linux-build-$BUILD_NUMBER/MODUS.x86_64" \
            --extra "server.pck=artifacts/linux-build-$BUILD_NUMBER/MODUS.pck" \
            --extra "modus-editor=artifacts/linux-editor-build-$BUILD_NUMBER/modus-editor.x86_64" \
            --extra "modus-editor.pck=artifacts/linux-editor-build-$BUILD_NUMBER/modus-editor.pck" \
            --output "build/release/modus-$version-linux-x86_64.tar.zst"
          python3 tools/package_overzeer.py package \
            --version "$version" --target linux-x86_64 \
            --executable "artifacts/linux-client-build-$BUILD_NUMBER/modus.x86_64" \
            --content "artifacts/linux-client-build-$BUILD_NUMBER/modus.pck" \
            --readme README.md --license LICENSE \
            --extra "server=artifacts/linux-build-$BUILD_NUMBER/MODUS.x86_64" \
            --extra "server.pck=artifacts/linux-build-$BUILD_NUMBER/MODUS.pck" \
            --extra "modus-editor=artifacts/linux-editor-build-$BUILD_NUMBER/modus-editor.x86_64" \
            --extra "modus-editor.pck=artifacts/linux-editor-build-$BUILD_NUMBER/modus-editor.pck" \
            --output "build/release/modus-$version-linux-x86_64.tar.gz"
          python3 tools/package_overzeer.py package \
            --version "$version" --target windows-x86_64 \
            --executable "artifacts/windows-build-$BUILD_NUMBER/MODUS.exe" \
            --content "artifacts/windows-build-$BUILD_NUMBER/MODUS.pck" \
            --readme README.md --license LICENSE \
            --extra "modus-editor.exe=artifacts/editor-build-$BUILD_NUMBER/MODUS-editor.exe" \
            --extra "modus-editor.pck=artifacts/editor-build-$BUILD_NUMBER/MODUS-editor.pck" \
            --output "build/release/modus-$version-windows-x86_64.tar.zst"
          python3 tools/package_overzeer.py package \
            --version "$version" --target windows-x86_64 \
            --executable "artifacts/windows-build-$BUILD_NUMBER/MODUS.exe" \
            --content "artifacts/windows-build-$BUILD_NUMBER/MODUS.pck" \
            --readme README.md --license LICENSE \
            --extra "modus-editor.exe=artifacts/editor-build-$BUILD_NUMBER/MODUS-editor.exe" \
            --extra "modus-editor.pck=artifacts/editor-build-$BUILD_NUMBER/MODUS-editor.pck" \
            --output "build/release/modus-$version-windows-x86_64.zip"
          python3 tools/validate_overzeer_release.py \
            --version "$version" --build-id "$BUILD_COMMIT" \
            --root build/release \
            --toolchain-lock tools/toolchain.lock.json \
            --output build/release/overzeer-release.json \
            --ztash-output build/release/ztash-source-release.json
          python3 tools/prepare_ztash_release.py \
            --version "$version" --build-id "$BUILD_COMMIT" \
            --root build/release \
            --toolchain-lock tools/toolchain.lock.json \
            --windows-launcher build/ztash/modus.exe \
            --output build/release/ztash
          printf 'Unsigned Linux and Windows candidates plus lean ZTASH receiver packages assembled. Native integration lock, signing, publication and target acceptance remain open.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Retain Linux release candidate
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-candidate-${{ github.run_number }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
