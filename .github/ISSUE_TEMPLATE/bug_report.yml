name: Bug report
description: Report a reproducible problem in MODUS
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Remove credentials, personal data, and private server details before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, commit SHA, or branch.
      placeholder: v0.9.5-beta
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest reliable sequence, map, mode, and configuration that triggers the problem.
      placeholder: |
        1. Start...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or media
      description: Paste relevant logs or attach a screenshot/video. Redact private data.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Hardware, network shape, enabled mods, or anything else that changes the result.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, personal data, and private infrastructure details.
          required: true
