name: Feature request
description: Propose a focused capability or workflow improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        MODUS is an experimental mechanics lab. Explain the player, modder, or contributor problem before proposing an implementation.
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options:
        - Player
        - Mod author
        - Level designer
        - Server operator
        - Contributor
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior without prescribing internal architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workflows, workarounds, or smaller options you considered.
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and risks
      description: Note networking, compatibility, accessibility, performance, or asset-license concerns.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and roadmap documents.
          required: true
        - label: This request does not depend on undisclosed proprietary assets or services.
          required: true
